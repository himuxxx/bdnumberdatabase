<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#05070a" />
<title>BD NUM TO NID</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<!-- Turnstile Script -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<style>
  :root {
    --bg:#05070a; --panel:rgba(10,20,28,.72);
    --line:rgba(0,255,170,.14); --line-strong:rgba(0,255,170,.4);
    --text:#d6f5e8; --muted:#5d7c74; --neon:#00ffaa; --neon-2:#00d4ff;
    --warn:#ff5470; --shadow:0 0 24px rgba(0,255,170,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    background:var(--bg);color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  body::before {
    content:"";position:fixed;inset:0;
    background-image:
      linear-gradient(rgba(0,255,170,.045) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,255,170,.045) 1px,transparent 1px);
    background-size:44px 44px;pointer-events:none;z-index:0;
    mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 85%);
  }
  body::after {
    content:"";position:fixed;inset:0;
    background:repeating-linear-gradient(to bottom,
      rgba(255,255,255,.018) 0,rgba(255,255,255,.018) 1px,transparent 1px,transparent 3px);
    pointer-events:none;z-index:2;mix-blend-mode:overlay;
  }

  .shell {
    position: relative; z-index: 3; height: 100dvh; max-width: 640px;
    margin: 0 auto; padding: 16px 16px 0; display: flex; flex-direction: column; overflow: hidden;
  }

  .hdr { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:4px; flex-wrap:wrap; flex-shrink:0; }
  .dot { width:8px;height:8px;border-radius:50%;background:var(--neon); box-shadow:0 0 10px var(--neon),0 0 20px var(--neon); animation:pulse 2s infinite;flex-shrink:0; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  .title { font-size:clamp(16px,4vw,20px);font-weight:700;letter-spacing:.06em; color:var(--text);text-transform:uppercase; }
  .title .accent { color:var(--neon); text-shadow:0 0 14px rgba(0,255,170,.55); }
  .tagline { font-size:11px;color:var(--muted);letter-spacing:.05em; margin-bottom:14px; display:flex;align-items:center;justify-content:center;gap:8px; flex-shrink:0; }
  .cursor { display:inline-block;width:7px;height:12px;background:var(--neon); animation:blink 1.05s steps(1) infinite;box-shadow:0 0 10px var(--neon); vertical-align:middle; }
  @keyframes blink { 50%{opacity:0} }

  .search { position:relative;display:flex;gap:10px;margin-bottom:10px;flex-shrink:0; }
  .search::before { content:"> ";position:absolute;left:14px;top:50%;transform:translateY(-50%); color:var(--neon);font-weight:700;z-index:1;text-shadow:0 0 8px var(--neon); }
  input {
    flex:1;padding:13px 14px 13px 36px;border-radius:8px;
    border:1px solid var(--line-strong);background:var(--panel);
    color:var(--text);font-size:16px;font-family:inherit;letter-spacing:.04em;
    outline:none;transition:border-color .2s,box-shadow .2s,background .2s;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  input::placeholder { color:#3d534d; }
  input:focus {
    border-color:var(--neon);background:rgba(10,26,22,.9);
    box-shadow:0 0 0 1px var(--neon),0 0 24px rgba(0,255,170,.35);
  }
  button {
    padding:0 18px;min-height:48px;border-radius:8px;border:1px solid var(--neon);
    background:transparent;color:var(--neon);font-weight:700;font-size:13px;
    font-family:inherit;letter-spacing:.15em;text-transform:uppercase;
    cursor:pointer;transition:all .2s;text-shadow:0 0 8px rgba(0,255,170,.6);
  }
  button:hover,button:focus-visible {
    background:rgba(0,255,170,.1);
    box-shadow:0 0 18px rgba(0,255,170,.5),inset 0 0 18px rgba(0,255,170,.08);outline:none;
  }
  button:active { transform:translateY(1px); }
  button:disabled { opacity:.4;cursor:not-allowed; }

  .status { font-size:11px;color:var(--muted);letter-spacing:.06em; margin-bottom:10px;min-height:14px; display:flex;align-items:center;gap:6px;flex-shrink:0; font-variant-numeric:tabular-nums; }
  .status.ok { color: var(--neon); text-shadow: 0 0 8px rgba(0,255,170,.55); }
  .status.err { color:var(--warn); }
  .status .pill { display:inline-block;width:6px;height:6px;border-radius:50%; background:currentColor;box-shadow:0 0 8px currentColor;flex-shrink:0; }

  #out {
    flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
    display: flex; flex-direction: column; gap: 12px;
    padding: 2px 2px 40px 2px; -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgba(0,255,170,.35) transparent;
  }
  #out::-webkit-scrollbar { width: 5px; }
  #out::-webkit-scrollbar-thumb { background: rgba(0,255,170,.35); border-radius: 3px; }

  .card {
    position: relative; background: var(--panel); border: 1px solid var(--line-strong);
    border-radius: 10px; padding: 2px 16px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: var(--shadow), inset 0 1px 0 rgba(0,255,170,.08);
    overflow: hidden; animation: slideUp .22s cubic-bezier(.22,1,.36,1) backwards; flex-shrink: 0;
  }
  .card::before {
    content:"";position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--neon),transparent); opacity:.7;
  }
  @keyframes slideUp { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }
  .row { display:flex;justify-content:space-between;align-items:center;gap:12px; padding:10px 0;border-bottom:1px dashed var(--line);font-size:13px; }
  .row:last-child { border-bottom:none; }
  .label { color:var(--muted);font-size:10px;letter-spacing:.18em;text-transform:uppercase; }
  .val { color:var(--text);font-weight:500;letter-spacing:.04em; text-align:right;word-break:break-all;font-variant-numeric:tabular-nums; }
  .val.nid { color:var(--neon-2); text-shadow:0 0 10px rgba(0,212,255,.4); }
  .val.dob { color:var(--neon); text-shadow:0 0 10px rgba(0,255,170,.35); }
  .val mark { background:transparent;color:#fff; text-shadow:0 0 10px var(--neon),0 0 20px rgba(0,255,170,.7); font-weight:700; }

  .empty, .error { padding:16px;border-radius:8px;font-size:12px; border:1px solid var(--line);background:var(--panel); letter-spacing:.03em;flex-shrink:0; }
  .empty { color:var(--muted); }
  .empty::before { content:"// ";color:var(--neon); }
  .error { color:var(--warn);border-color:rgba(255,84,112,.4); }
  .error::before { content:"!! ";font-weight:700; }
  .error pre { margin:10px 0 0;font-size:10px;color:#ffb4c0;white-space:pre-wrap; word-break:break-all;max-height:200px;overflow:auto; }

  .loading { text-align:center;padding:14px 0;font-size:11px;color:var(--muted); letter-spacing:.1em;flex-shrink:0; }
  .loading::after { content:"";display:inline-block;width:8px;height:8px;border:1px solid var(--neon); border-top-color:transparent;border-radius:50%; margin-left:6px;vertical-align:middle; animation:spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .foot { position:fixed;bottom:0;left:0;right:0;height:2px; background:linear-gradient(90deg,transparent,var(--neon),transparent); opacity:.5;z-index:3;pointer-events:none; }

  #turnstile-container { margin-bottom: 10px; display: flex; justify-content: center; flex-shrink: 0; }

  @media(max-width:480px){
    .search { flex-direction: column; gap: 8px; }
    .search::before { top: 24px; }
    button { width: 100%; min-height: 44px; }
    .row { padding: 9px 0; font-size: 12px; }
    .shell { padding: 14px 12px 0; }
  }
</style>
</head>
<body>
<div class="shell">
  <div class="hdr">
    <span class="dot"></span>
    <span class="title">BD<span class="accent"> NUM </span>TO<span class="accent"> NID</span></span>
  </div>
  <div class="tagline">
    <span>Mobile Number &rarr; NID &amp; DOB</span>
    <span class="cursor"></span>
  </div>

  <form class="search" id="form" autocomplete="off">
    <input id="q" type="tel" inputmode="numeric" placeholder="01765" maxlength="20" aria-label="Phone prefix or full number" />
    <button type="submit" id="btn">SCAN</button>
  </form>

  <div id="turnstile-container"></div>

  <div class="status" id="status"></div>
  <div id="out"></div>
</div>
<div class="foot"></div>

<script>
const $q = document.getElementById('q');
const $out = document.getElementById('out');
const $status = document.getElementById('status');
const $btn = document.getElementById('btn');
const $form = document.getElementById('form');

const MIN_PREFIX = 3;
const PAGE_SIZE = 100;

// Your actual Site Key
const TURNSTILE_SITE_KEY = '0x4AAAAAAFsXi1h2M35slh8X'; 

let turnstileToken = '';
let dbTotal = 0;
let currentQuery = '';
let currentOffset = 0;
let currentTotalMatches = 0;
let loading = false;
let moreAvailable = false;
let inFlight = null;
let debounceTimer = null;

const sentinel = document.createElement('div');
sentinel.style.cssText = 'height:1px;width:100%;flex-shrink:0;';
$out.appendChild(sentinel);

const io = new IntersectionObserver(entries => {
  if (!entries[0].isIntersecting) return;
  if (loading || !moreAvailable) return;
  loadPage(false);
}, { root: $out, rootMargin: '400px' });
io.observe(sentinel);

/* ---------- Turnstile setup ---------- */
window.onloadTurnstileCallback = function() {
  turnstile.render('#turnstile-container', {
    sitekey: TURNSTILE_SITE_KEY,
    theme: 'dark',
    callback: function(token) {
      turnstileToken = token;
      if ($q.value.length >= MIN_PREFIX && $out.innerHTML === '') {
        startSearch($q.value);
      }
    },
    'expired-callback': function() {
      turnstileToken = '';
    }
  });
};

if (window.turnstile) {
  window.onloadTurnstileCallback();
}

/* ---------- status ---------- */
function setStatus(text, cls) {
  $status.className = 'status ' + (cls || '');
  $status.innerHTML = '<span class="pill"></span><span>' + escapeHtml(String(text == null ? '' : text)) + '</span>';
}

function idleStatus() {
  if (dbTotal) {
    setStatus('database: ' + dbTotal.toLocaleString() + ' records · type a number to scan', 'ok');
  } else {
    setStatus('type a number to scan', 'ok');
  }
}

/* ---------- total DB ---------- */
async function loadTotal() {
  try {
    const res = await fetch('/api/lookup?info=1', { headers: { 'accept': 'application/json' } });
    if (!res.ok) return;
    const data = await res.json();
    if (data && typeof data.total === 'number') {
      dbTotal = data.total;
      if (!currentQuery) idleStatus();
    }
  } catch (_) {}
}

/* ---------- helpers ---------- */
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function highlight(num, prefix) {
  const s = String(num == null ? '' : num);
  if (prefix && s.startsWith(prefix)) {
    return '<mark>' + escapeHtml(prefix) + '</mark>' + escapeHtml(s.slice(prefix.length));
  }
  return escapeHtml(s);
}

function renderCard(r, prefix) {
  return `
    <div class="card">
      <div class="row"><span class="label">number</span><span class="val">${highlight(r.number, prefix)}</span></div>
      <div class="row"><span class="label">nid</span><span class="val nid">${escapeHtml(r.nid)}</span></div>
      <div class="row"><span class="label">dob</span><span class="val dob">${escapeHtml(r.dob)}</span></div>
    </div>
  `;
}

/* ---------- page loader ---------- */
async function loadPage(isFirst) {
  if (loading) return;
  if (!isFirst && currentOffset >= currentTotalMatches) return;

  if (!turnstileToken) {
    setStatus('waiting for captcha…', 'ok');
    return;
  }

  loading = true;
  $btn.disabled = true;

  if (isFirst) {
    while ($out.firstChild && $out.firstChild !== sentinel) {
      $out.removeChild($out.firstChild);
    }
    currentOffset = 0;
    currentTotalMatches = 0;
    moreAvailable = false;
    setStatus('scanning…', '');
  }

  const loadEl = document.createElement('div');
  loadEl.className = 'loading';
  loadEl.textContent = isFirst ? 'scanning' : 'loading more';
  $out.insertBefore(loadEl, sentinel);

  if (inFlight) inFlight.abort();
  const ctrl = new AbortController();
  inFlight = ctrl;

  try {
    const url = '/api/lookup?q=' + encodeURIComponent(currentQuery)
              + '&offset=' + currentOffset
              + '&limit='  + PAGE_SIZE
              + '&token='  + encodeURIComponent(turnstileToken);
              
    const res = await fetch(url, {
      signal: ctrl.signal,
      headers: { 'accept': 'application/json' }
    });

    if (loadEl.parentNode) loadEl.remove();
    const rawText = await res.text();

    if (!res.ok) {
      setStatus('HTTP ' + res.status, 'err');
      if (isFirst) {
        $out.insertAdjacentHTML('afterbegin', '<div class="error"><pre>' + escapeHtml(rawText.slice(0, 800)) + '</pre></div>');
      }
      return;
    }

    let data;
    try { data = JSON.parse(rawText); }
    catch (_) {
      setStatus('bad json from API', 'err');
      if (isFirst) {
        $out.insertAdjacentHTML('afterbegin', '<div class="error"><pre>' + escapeHtml(rawText.slice(0, 800)) + '</pre></div>');
      }
      return;
    }

    currentTotalMatches = Number(data.total_matches) || 0;
    if (typeof data.total === 'number') dbTotal = data.total;

    const rawMatches = Array.isArray(data.matches) ? data.matches : [];
    const hits = rawMatches.map(r => ({
      number: String((r && r.number) == null ? '' : r.number),
      nid:    String((r && r.nid)    == null ? '' : r.nid),
      dob:    String((r && r.dob)    == null ? '' : r.dob)
    }));

    if (isFirst && !hits.length) {
      setStatus('no match', 'err');
      $out.insertAdjacentHTML('afterbegin', '<div class="empty">এই prefix-এ কোনো রেকর্ড পাওয়া যায়নি।</div>');
      return;
    }

    const html = hits.map(r => renderCard(r, currentQuery)).join('');
    sentinel.insertAdjacentHTML('beforebegin', html);

    currentOffset += hits.length;
    moreAvailable = currentOffset < currentTotalMatches;

    setStatus(
      currentTotalMatches.toLocaleString() + ' match' +
      (currentTotalMatches === 1 ? '' : 'es') +
      ' · showing ' + currentOffset.toLocaleString() +
      ' · "' + currentQuery + '"',
      'ok'
    );

  } catch (e) {
    if (e.name === 'AbortError') return;
    if (loadEl.parentNode) loadEl.remove();
    setStatus('network error', 'err');
    if (isFirst) {
      $out.insertAdjacentHTML('afterbegin', '<div class="error">' + escapeHtml(e.message) + '</div>');
    }
  } finally {
    if (inFlight === ctrl) inFlight = null;
    loading = false;
    $btn.disabled = false;
  }
}

function startSearch(prefix) {
  prefix = String(prefix || '').trim();
  currentQuery = prefix;

  if (!prefix) { idleStatus(); return; }
  if (prefix.length < MIN_PREFIX) {
    setStatus('type at least ' + MIN_PREFIX + ' digits…', 'ok');
    return;
  }

  $out.scrollTop = 0;
  loadPage(true);
}

$form.addEventListener('submit', e => { e.preventDefault(); startSearch($q.value); });

$q.addEventListener('input', () => {
  $q.value = $q.value.replace(/\D/g, '').slice(0, 20);
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => startSearch($q.value), 200);
});

idleStatus();
loadTotal();
</script>
</body>
</html>
