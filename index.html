<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lookup</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --line: #262b35;
    --text: #e6e9ef;
    --muted: #8b92a1;
    --accent: #4f8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Bengali", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 24px 16px 64px;
  }
  .wrap { width: 100%; max-width: 520px; }
  h1 { font-size: 18px; font-weight: 600; margin: 8px 0 6px; letter-spacing: 0.2px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  .search { display: flex; gap: 8px; margin-bottom: 20px; }
  input {
    flex: 1;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    font-size: 16px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    padding: 14px 18px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
  }
  button:active { transform: translateY(1px); }
  .result {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 6px 16px;
    margin-bottom: 12px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px dashed var(--line);
    font-size: 15px;
  }
  .row:last-child { border-bottom: none; }
  .label { color: var(--muted); }
  .val { font-variant-numeric: tabular-nums; }
  .empty, .error {
    padding: 16px;
    border-radius: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 14px;
  }
  .error { color: #ff8b8b; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Number Lookup</h1>
  <p class="sub">মোবাইল নাম্বার লিখে সার্চ করুন</p>

  <form class="search" onsubmit="event.preventDefault(); runSearch();">
    <input id="q" type="tel" inputmode="numeric" placeholder="01XXXXXXXXX" autocomplete="off" />
    <button type="submit">Search</button>
  </form>

  <div id="out"></div>
</div>

<script>
let DB = null;

function stripTrailingCommas(s) {
  return s.replace(/,\s*(?=[}\]])/g, '');
}

async function loadDB() {
  const out = document.getElementById('out');
  try {
    const res = await fetch('./data.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('data.json load failed (' + res.status + ')');
    const raw = await res.text();
    DB = JSON.parse(stripTrailingCommas(raw));
    if (!Array.isArray(DB)) throw new Error('data.json is not an array');
    return true;
  } catch (e) {
    out.innerHTML = '<div class="error">' + escapeHtml(e.message) + '</div>';
    return false;
  }
}

async function runSearch() {
  const out = document.getElementById('out');
  const q = document.getElementById('q').value.trim();
  if (!q) { out.innerHTML = ''; return; }
  if (!DB) {
    const ok = await loadDB();
    if (!ok) return;
  }
  const hits = DB.filter(r => r && String(r.number) === q);
  if (hits.length === 0) {
    out.innerHTML = '<div class="empty">এই নাম্বারে কোনো রেকর্ড পাওয়া যায়নি।</div>';
    return;
  }
  out.innerHTML = hits.map(r => `
    <div class="result">
      <div class="row"><span class="label">Number</span><span class="val">${escapeHtml(r.number)}</span></div>
      <div class="row"><span class="label">NID</span><span class="val">${escapeHtml(r.nid)}</span></div>
      <div class="row"><span class="label">DOB</span><span class="val">${escapeHtml(r.dob)}</span></div>
    </div>
  `).join('');
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

loadDB();
</script>
</body>
</html>
