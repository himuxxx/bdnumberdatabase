<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#05070a" />
<title>BD NUM TO NID</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#05070a; --panel:rgba(10,20,28,.72);
    --line:rgba(0,255,170,.14); --line-strong:rgba(0,255,170,.4);
    --text:#d6f5e8; --muted:#5d7c74; --neon:#00ffaa; --neon-2:#00d4ff;
    --warn:#ff5470; --shadow:0 0 24px rgba(0,255,170,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;
    background-image:
      linear-gradient(rgba(0,255,170,.045) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,255,170,.045) 1px,transparent 1px);
    background-size:44px 44px;pointer-events:none;z-index:0;
    mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 85%);
  }
  body::after{
    content:"";position:fixed;inset:0;
    background:repeating-linear-gradient(to bottom,
      rgba(255,255,255,.018) 0,rgba(255,255,255,.018) 1px,transparent 1px,transparent 3px);
    pointer-events:none;z-index:2;mix-blend-mode:overlay;
  }
  .shell{position:relative;z-index:3;max-width:640px;margin:0 auto;
    padding:clamp(24px,6vw,56px) 18px 80px;}
  .hdr{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--neon);
    box-shadow:0 0 10px var(--neon),0 0 20px var(--neon);animation:pulse 2s infinite;flex-shrink:0;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .title{font-size:clamp(17px,4.2vw,21px);font-weight:700;letter-spacing:.06em;
    color:var(--text);text-transform:uppercase;}
  .title .accent{color:var(--neon);text-shadow:0 0 14px rgba(0,255,170,.55);}
  .tagline{font-size:12px;color:var(--muted);letter-spacing:.05em;margin-bottom:28px;
    display:flex;align-items:center;gap:8px;}
  .cursor{display:inline-block;width:8px;height:14px;background:var(--neon);
    animation:blink 1.05s steps(1) infinite;box-shadow:0 0 10px var(--neon);vertical-align:middle;}
  @keyframes blink{50%{opacity:0}}
  .search{position:relative;display:flex;gap:10px;margin-bottom:22px;}
  .search::before{content:"> ";position:absolute;left:16px;top:50%;transform:translateY(-50%);
    color:var(--neon);font-weight:700;z-index:1;text-shadow:0 0 8px var(--neon);}
  input{flex:1;padding:16px 16px 16px 40px;border-radius:8px;border:1px solid var(--line-strong);
    background:var(--panel);color:var(--text);font-size:16px;font-family:inherit;letter-spacing:.04em;
    outline:none;transition:border-color .2s,box-shadow .2s,background .2s;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
  input::placeholder{color:#3d534d;}
  input:focus{border-color:var(--neon);background:rgba(10,26,22,.9);
    box-shadow:0 0 0 1px var(--neon),0 0 24px rgba(0,255,170,.35);}
  button{padding:0 22px;min-height:54px;border-radius:8px;border:1px solid var(--neon);
    background:transparent;color:var(--neon);font-weight:700;font-size:14px;font-family:inherit;
    letter-spacing:.15em;text-transform:uppercase;cursor:pointer;transition:all .2s;
    text-shadow:0 0 8px rgba(0,255,170,.6);}
  button:hover,button:focus-visible{background:rgba(0,255,170,.1);
    box-shadow:0 0 18px rgba(0,255,170,.5),inset 0 0 18px rgba(0,255,170,.08);outline:none;}
  button:active{transform:translateY(1px);}
  button:disabled{opacity:.4;cursor:not-allowed;}
  .status{font-size:11px;color:var(--muted);letter-spacing:.06em;margin-bottom:16px;
    min-height:14px;display:flex;align-items:center;gap:6px;}
  .status.ok{color:var(--neon);}
  .status.err{color:var(--warn);}
  .status .pill{display:inline-block;width:6px;height:6px;border-radius:50%;
    background:currentColor;box-shadow:0 0 8px currentColor;}
  #out{display:flex;flex-direction:column;gap:12px;}
  .card{position:relative;background:var(--panel);border:1px solid var(--line-strong);
    border-radius:10px;padding:4px 18px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    box-shadow:var(--shadow),inset 0 1px 0 rgba(0,255,170,.08);
    overflow:hidden;animation:slideUp .28s cubic-bezier(.22,1,.36,1) backwards;}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--neon),transparent);opacity:.7;}
  @keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:13px 0;border-bottom:1px dashed var(--line);font-size:14px;}
  .row:last-child{border-bottom:none;}
  .label{color:var(--muted);font-size:11px;letter-spacing:.18em;text-transform:uppercase;}
  .val{color:var(--text);font-weight:500;letter-spacing:.06em;text-align:right;
    word-break:break-all;font-variant-numeric:tabular-nums;}
  .val.nid{color:var(--neon-2);text-shadow:0 0 10px rgba(0,212,255,.4);}
  .val.dob{color:var(--neon);text-shadow:0 0 10px rgba(0,255,170,.35);}
  .val mark{background:transparent;color:#fff;
    text-shadow:0 0 10px var(--neon),0 0 20px rgba(0,255,170,.7);font-weight:700;}
  .empty,.error{padding:18px;border-radius:8px;font-size:13px;
    border:1px solid var(--line);background:var(--panel);letter-spacing:.03em;}
  .empty{color:var(--muted);}
  .empty::before{content:"// ";color:var(--neon);}
  .error{color:var(--warn);border-color:rgba(255,84,112,.4);}
  .error::before{content:"!! ";font-weight:700;}
  .error pre{margin:10px 0 0;font-size:11px;color:#ffb4c0;white-space:pre-wrap;
    word-break:break-all;max-height:220px;overflow:auto;}
  .more{text-align:center;font-size:12px;color:var(--muted);padding:14px 0;letter-spacing:.06em;}
  details.raw{margin-top:8px;font-size:11px;color:var(--muted);}
  details.raw summary{cursor:pointer;color:var(--neon);}
  details.raw pre{margin:8px 0 0;font-size:10px;max-height:200px;overflow:auto;
    white-space:pre-wrap;word-break:break-all;color:var(--muted);}
  .foot{position:fixed;bottom:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--neon),transparent);opacity:.5;z-index:3;}
  @media(max-width:480px){
    .search{flex-direction:column;}
    .search::before{top:27px;}
    button{width:100%;min-height:48px;}
    .row{padding:12px 0;font-size:13px;}
  }
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;
      animation-iteration-count:1!important;transition-duration:.001ms!important;}
  }
</style>
</head>
<body>
<div class="shell">
  <div class="hdr">
    <span class="dot"></span>
    <span class="title">BD<span class="accent"> NUM </span>TO<span class="accent"> NID</span></span>
  </div>
  <div class="tagline">
    <span>Mobile Number &rarr; NID &amp; DOB</span>
    <span class="cursor"></span>
  </div>

  <form class="search" id="form" autocomplete="off">
    <input id="q" type="tel" inputmode="numeric" placeholder="01765" maxlength="20" aria-label="Phone prefix or full number" />
    <button type="submit" id="btn">SCAN</button>
  </form>

  <div class="status" id="status"></div>
  <div id="out"></div>
</div>
<div class="foot"></div>

<script>
const $q = document.getElementById('q');
const $out = document.getElementById('out');
const $status = document.getElementById('status');
const $btn = document.getElementById('btn');
const $form = document.getElementById('form');

let debounceTimer = null;
let inFlight = null;
const MIN_PREFIX = 3;

function setStatus(text, cls) {
  $status.className = 'status ' + (cls || '');
  const safe = String(text == null ? '' : text);
  $status.innerHTML = '<span class="pill"></span><span>' + escapeHtml(safe) + '</span>';
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function highlight(num, prefix) {
  const s = String(num == null ? '' : num);
  if (prefix && s.startsWith(prefix)) {
    return '<mark>' + escapeHtml(prefix) + '</mark>' + escapeHtml(s.slice(prefix.length));
  }
  return escapeHtml(s);
}

async function runSearch(prefix) {
  prefix = String(prefix || '').trim();
  $out.innerHTML = '';

  if (!prefix) { setStatus('type a number to scan', ''); return; }
  if (prefix.length < MIN_PREFIX) {
    setStatus('type at least ' + MIN_PREFIX + ' digits…', '');
    return;
  }

  if (inFlight && inFlight.abort) inFlight.abort();
  const ctrl = new AbortController();
  inFlight = ctrl;
  $btn.disabled = true;
  setStatus('scanning…', '');

  try {
    const res = await fetch('/api/lookup?q=' + encodeURIComponent(prefix), {
      signal: ctrl.signal,
      headers: { 'accept': 'application/json' }
    });

    const rawText = await res.text();

    if (!res.ok) {
      setStatus('HTTP ' + res.status, 'err');
      $out.innerHTML = '<div class="error"><pre>' + escapeHtml(rawText.slice(0, 800)) + '</pre></div>';
      return;
    }

    let data;
    try { data = JSON.parse(rawText); }
    catch (e) {
      setStatus('bad json from API', 'err');
      $out.innerHTML = '<div class="error"><pre>' + escapeHtml(rawText.slice(0, 800)) + '</pre></div>';
      return;
    }

    const rawMatches = data && data.matches;
    const hits = Array.isArray(rawMatches)
      ? rawMatches.map(r => ({
          number: String((r && r.number) == null ? '' : r.number),
          nid:    String((r && r.nid)    == null ? '' : r.nid),
          dob:    String((r && r.dob)    == null ? '' : r.dob)
        }))
      : [];

    if (!hits.length) {
      setStatus('no match', 'err');
      $out.innerHTML = '<div class="empty">এই prefix-এ কোনো রেকর্ড পাওয়া যায়নি।</div>';
      return;
    }

    setStatus(hits.length + ' match' + (hits.length > 1 ? 'es' : '') + ' · prefix "' + prefix + '"', 'ok');

    let html = hits.map(r => `
      <div class="card">
        <div class="row"><span class="label">number</span><span class="val">${highlight(r.number, prefix)}</span></div>
        <div class="row"><span class="label">nid</span><span class="val nid">${escapeHtml(r.nid)}</span></div>
        <div class="row"><span class="label">dob</span><span class="val dob">${escapeHtml(r.dob)}</span></div>
      </div>
    `).join('');

    if (data.truncated) {
      html += '<div class="more">showing first 100 &mdash; refine the prefix to narrow down</div>';
    }

    html += '<details class="raw"><summary>raw response</summary><pre>' + escapeHtml(rawText) + '</pre></details>';
    $out.innerHTML = html;

  } catch (e) {
    if (e.name === 'AbortError') return;
    setStatus('network error', 'err');
    $out.innerHTML = '<div class="error">' + escapeHtml(e.message) + '</div>';
  } finally {
    if (inFlight === ctrl) { inFlight = null; $btn.disabled = false; }
  }
}

$form.addEventListener('submit', e => { e.preventDefault(); runSearch($q.value); });

$q.addEventListener('input', () => {
  $q.value = $q.value.replace(/\D/g, '').slice(0, 20);
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => runSearch($q.value), 180);
});
</script>
</body>
</html>
